<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Photography by Albert Du — life and travels through the lens of a Fujifilm XT-50." />
  <title>Photography &mdash; Albert Du</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/favicons/favicon.png" />
  <link rel="apple-touch-icon" href="images/favicons/webclip.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />

  <!-- Shared stylesheet -->
  <link rel="stylesheet" href="styles.css?v=3" />

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4X8SCKNF0V"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4X8SCKNF0V');
  </script>
</head>

<body>

  <!-- ============================================================
       MINIMAL HEADER NAV
       ============================================================ -->
  <header class="photo-page-header">
    <nav class="photo-page-nav" aria-label="Photography page navigation">
      <a href="index.html" class="photo-nav-logo" aria-label="Albert Du — home">Albert Du</a>
      <a href="index.html" class="photo-nav-back" aria-label="Back to home">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M10 7H2M6 3l-4 4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Home
      </a>
    </nav>
  </header>

  <main>

    <!-- ============================================================
         PAGE HERO
         ============================================================ -->
    <section class="photo-hero container fade-up" aria-labelledby="photo-page-title">
      <h1 class="photo-hero-title" id="photo-page-title">Some of my photos</h1>
      <p class="photo-hero-sub">Follow my <a href="https://www.instagram.com/albertkdu/" target="_blank" rel="noopener noreferrer" style="color:var(--accent);text-decoration:none;">Instagram</a> for more</p>
    </section>

    <!-- ============================================================
         GALLERY
         ============================================================ -->
    <section class="gallery-section container" aria-label="Photo gallery">
      <div class="gallery-grid">

        <!-- Placeholder items — replace src/alt with real images -->
        <!-- Varying aspect ratios simulate a masonry feel -->

        <div class="gallery-item" style="aspect-ratio:3/4" tabindex="0" role="button" aria-label="View photo 1" data-full="images/photography/01.jpg">
          <img src="images/photography/thumbs/01.jpg" alt="Photo 1" loading="lazy" onerror="this.parentElement.style.display='none'" />
        </div>

        <div class="gallery-item" style="aspect-ratio:4/3" tabindex="0" role="button" aria-label="View photo 2" data-full="images/photography/02.jpg">
          <img src="images/photography/thumbs/02.jpg" alt="Photo 2" loading="lazy" onerror="this.parentElement.style.display='none'" />
        </div>

        <div class="gallery-item" style="aspect-ratio:1/1" tabindex="0" role="button" aria-label="View photo 3" data-full="images/photography/03.jpg">
          <img src="images/photography/thumbs/03.jpg" alt="Photo 3" loading="lazy" onerror="this.parentElement.style.display='none'" />
        </div>

        <div class="gallery-item" style="aspect-ratio:3/4" tabindex="0" role="button" aria-label="View photo 4" data-full="images/photography/04.jpg">
          <img src="images/photography/thumbs/04.jpg" alt="Photo 4" loading="lazy" onerror="this.parentElement.style.display='none'" />
        </div>

        <div class="gallery-item" style="aspect-ratio:2/3" tabindex="0" role="button" aria-label="View photo 5" data-full="images/photography/05.jpg">
          <img src="images/photography/thumbs/05.jpg" alt="Photo 5" loading="lazy" onerror="this.parentElement.style.display='none'" />
        </div>

        <div class="gallery-item" style="aspect-ratio:16/9" tabindex="0" role="button" aria-label="View photo 6" data-full="images/photography/06.jpg">
          <img src="images/photography/thumbs/06.jpg" alt="Photo 6" loading="lazy" onerror="this.parentElement.style.display='none'" />
        </div>

        <div class="gallery-item" style="aspect-ratio:3/4" tabindex="0" role="button" aria-label="View photo 7" data-full="images/photography/07.jpg">
          <img src="images/photography/thumbs/07.jpg" alt="Photo 7" loading="lazy" onerror="this.parentElement.style.display='none'" />
        </div>

        <div class="gallery-item" style="aspect-ratio:4/5" tabindex="0" role="button" aria-label="View photo 8" data-full="images/photography/08.jpg">
          <img src="images/photography/thumbs/08.jpg" alt="Photo 8" loading="lazy" onerror="this.parentElement.style.display='none'" />
        </div>

        <div class="gallery-item" style="aspect-ratio:1/1" tabindex="0" role="button" aria-label="View photo 9" data-full="images/photography/09.jpg">
          <img src="images/photography/thumbs/09.jpg" alt="Photo 9" loading="lazy" onerror="this.parentElement.style.display='none'" />
        </div>

        <div class="gallery-item" style="aspect-ratio:2/3" tabindex="0" role="button" aria-label="View photo 10" data-full="images/photography/10.jpg">
          <img src="images/photography/thumbs/10.jpg" alt="Photo 10" loading="lazy" onerror="this.parentElement.style.display='none'" />
        </div>

        <div class="gallery-item" style="aspect-ratio:4/3" tabindex="0" role="button" aria-label="View photo 11" data-full="images/photography/11.jpg">
          <img src="images/photography/thumbs/11.jpg" alt="Photo 11" loading="lazy" onerror="this.parentElement.style.display='none'" />
        </div>

        <div class="gallery-item" style="aspect-ratio:3/4" tabindex="0" role="button" aria-label="View photo 12" data-full="images/photography/12.jpg">
          <img src="images/photography/thumbs/12.jpg" alt="Photo 12" loading="lazy" onerror="this.parentElement.style.display='none'" />
        </div>

      </div>
    </section>

  </main>

  <!-- ============================================================
       LIGHTBOX
       ============================================================ -->
  <div class="lightbox" role="dialog" aria-modal="true" aria-label="Photo lightbox" tabindex="-1">
    <button class="lightbox-close" aria-label="Close lightbox">&times;</button>

    <button class="lightbox-btn lightbox-prev" aria-label="Previous photo">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M11 4l-5 5 5 5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="lightbox-img-wrap">
      <img src="" alt="" />
    </div>

    <button class="lightbox-btn lightbox-next" aria-label="Next photo">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M7 4l5 5-5 5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <p class="lightbox-counter" aria-live="polite"></p>
  </div>

  <!-- ============================================================
       FOOTER
       ============================================================ -->
  <footer class="footer" role="contentinfo">
    <div class="container">
      <div class="footer-inner">
        <p class="footer-copyright">&copy; 2026 Albert Du.</p>
        <p class="footer-copy">All photos my own.</p>
        <a href="index.html" class="footer-back" aria-label="Back to home">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M10 7H2M6 3l-4 4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Back to home
        </a>
      </div>
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
