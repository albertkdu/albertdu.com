<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protected Page — Albert Du</title>

  <link rel="icon" type="image/png" href="images/favicons/favicon.png" />
  <link rel="apple-touch-icon" href="images/favicons/webclip.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <style>
    /* ── 401 page layout ─────────────────────────────────── */
    .auth-section {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding-block: 6rem 4rem;
    }

    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 2.5rem 2.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .auth-icon {
      width: 40px;
      height: 40px;
      color: var(--accent);
    }

    .auth-heading {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 3vw, 2rem);
      color: var(--text);
      margin: 0 0 0.75rem;
      line-height: 1.45;
    }

    .auth-sub {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 0;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .auth-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .auth-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) / 2);
      padding: 0.7rem 1rem;
      font-family: var(--font-body);
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      box-sizing: border-box;
    }

    .auth-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-bg);
    }

    .auth-submit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: calc(var(--radius) / 2);
      padding: 0.75rem 1.5rem;
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: opacity var(--transition), transform var(--transition);
      margin-top: 0.25rem;
    }

    .auth-submit:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }

    .auth-error {
      display: none;
      background: color-mix(in srgb, #e53e3e 10%, transparent);
      border: 1px solid color-mix(in srgb, #e53e3e 30%, transparent);
      border-radius: calc(var(--radius) / 2);
      padding: 0.65rem 1rem;
      font-size: 0.85rem;
      color: #c53030;
    }

    .auth-error.visible { display: block; }
  </style>
</head>

<body>

  <!-- ============================================================
       NAVIGATION
       ============================================================ -->
  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="container">
      <div class="nav-inner">
        <a href="index.html" class="nav-logo" aria-label="Albert Du — home">Albert Du</a>
      </div>
    </div>
  </nav>

  <!-- ============================================================
       AUTH FORM
       ============================================================ -->
  <main id="main-content">
    <section class="auth-section">
      <div class="auth-card">

        <svg class="auth-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>

        <div>
          <h1 class="auth-heading">Protected page</h1>
          <p class="auth-sub">Enter the password to continue.</p>
        </div>

        <form action="/.wf_auth" method="post" class="auth-form" id="auth-form">
          <div>
            <label for="pass" class="auth-label">Password</label>
            <input
              type="password"
              id="pass"
              name="pass"
              class="auth-input"
              placeholder="Enter password"
              autofocus
              maxlength="256"
              autocomplete="current-password"
            />
          </div>

          <div class="auth-error" id="auth-error" role="alert">
            Incorrect password — please try again.
          </div>

          <button type="submit" class="auth-submit">
            Unlock
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <path d="M2 7h10M7 2l5 5-5 5" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <input type="hidden" name="path"  value="<%WF_FORM_VALUE_PATH%>" />
          <input type="hidden" name="page"  value="<%WF_FORM_VALUE_PAGE%>" />
        </form>

      </div>
    </section>
  </main>

  <!-- ============================================================
       FOOTER
       ============================================================ -->
  <footer class="footer" role="contentinfo">
    <div class="container">
      <div class="footer-inner">
        <p class="footer-copyright">&copy; 2026 Albert Du.</p>
        <a href="index.html" class="footer-back" aria-label="Back to home">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M10 7H2M6 3l-4 4 4 4" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Back to home
        </a>
      </div>
    </div>
  </footer>

  <script>
    // Show error message if ?e=1 is in the URL (Webflow auth failure signal)
    (function () {
      if (/[?&]e=1(&|$)/.test(window.location.search)) {
        document.getElementById('auth-error').classList.add('visible');
      }
    })();
  </script>

</body>
</html>
